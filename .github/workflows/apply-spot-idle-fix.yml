name: Apply Spot idle cache fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply and test
        shell: bash
        run: |
          set -euo pipefail
          PATCH=.github/patches/spot-idle-cache.patch
          if [[ ! -f "$PATCH" ]]; then
            echo "Fix already applied"
            exit 0
          fi
          git apply --check "$PATCH"
          git apply "$PATCH"
          rm -f "$PATCH"
          npm test
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve Spot ticker snapshot during idle pauses"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
