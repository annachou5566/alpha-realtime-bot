name: Backend checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/competition-calendar-series
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final source patch
        run: python scripts/apply_competition_calendar_series_final.py
      - name: Syntax and contracts
        run: npm test
      - name: Diff whitespace
        run: git diff --check
      - name: Commit product source only
        run: |
          git checkout -- .github/workflows/test.yml scripts/apply_competition_calendar_series_final.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js lib/competition-price-series.js test/competition-price-series.test.js
          git commit -m 'fix: migrate Competition price series to UTC boundaries'
          git push origin HEAD:chatgpt/competition-calendar-series
