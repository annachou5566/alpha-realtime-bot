name: Apply Render bandwidth patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          PARTS=(.github/patches/render-bandwidth.part*)
          if [[ ${#PARTS[@]} -eq 0 ]]; then
            echo "Patch already applied"
            exit 0
          fi
          cat "${PARTS[@]}" | base64 -d | gzip -d > /tmp/render-bandwidth.patch
          git apply --check /tmp/render-bandwidth.patch
          git apply /tmp/render-bandwidth.patch
          rm -f .github/patches/render-bandwidth.patch.gz.b64 "${PARTS[@]}" .github/patches/trigger.txt
          npm test
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize Render bandwidth and persist competition prices"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
