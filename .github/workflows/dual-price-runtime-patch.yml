name: Dual Price runtime patch

on:
  pull_request:
    paths:
      - 'scripts/patch-dual-price-runtime.py'
      - '.github/workflows/dual-price-runtime-patch.yml'
  push:
    branches:
      - chatgpt/competition-dual-price-boundaries
    paths:
      - 'scripts/patch-dual-price-runtime.py'
      - '.github/workflows/dual-price-runtime-patch.yml'

permissions:
  contents: write

concurrency:
  group: dual-price-runtime-patch
  cancel-in-progress: true

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/competition-dual-price-boundaries
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply runtime patch
        run: python scripts/patch-dual-price-runtime.py
      - name: Syntax
        run: |
          node --check index.js
          node --check lib/competition-price-series.js
      - name: Price boundary tests
        run: node --test test/competition-price-series.test.js
      - name: Diff whitespace
        run: git diff --check
      - name: Commit runtime patch
        run: |
          if git diff --quiet -- index.js lib/competition-price-series.js; then
            echo 'Runtime source was not changed' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js lib/competition-price-series.js
          git commit -m 'Competition: serve dual Price boundaries'
          git push origin HEAD:chatgpt/competition-dual-price-boundaries
