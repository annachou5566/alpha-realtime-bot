name: Validate Competition Price v3 fail closed

on:
  push:
    branches:
      - chatgpt/competition-dual-price-boundaries
    paths:
      - 'lib/competition-price-series.js'
      - 'test/competition-price-series.test.js'
      - '.github/workflows/patch-competition-price-no-fallback.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/competition-dual-price-boundaries
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and publish validation result
        shell: bash
        run: |
          set +e
          : > competition-price-validation.log
          status=0
          node --test test/competition-price-series.test.js 2>&1 | tee -a competition-price-validation.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            node --check lib/competition-price-series.js 2>&1 | tee -a competition-price-validation.log
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            node --check index.js 2>&1 | tee -a competition-price-validation.log
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check 2>&1 | tee -a competition-price-validation.log
            status=${PIPESTATUS[0]}
          fi
          echo "VALIDATION_STATUS=$status" | tee -a competition-price-validation.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competition-price-validation.log
          if ! git diff --cached --quiet; then
            git commit -m 'test: record Price v3 fail-closed validation'
            git push origin HEAD:chatgpt/competition-dual-price-boundaries
          fi
          exit "$status"
