name: Patch Competition Price v3 fail closed

on:
  push:
    branches:
      - chatgpt/competition-dual-price-boundaries
    paths:
      - 'scripts/patch-competition-price-no-fallback.py'
      - '.github/workflows/patch-competition-price-no-fallback.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/competition-dual-price-boundaries
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply fail-closed patch
        run: python scripts/patch-competition-price-no-fallback.py
      - name: Test Price v3 boundaries
        run: node --test test/competition-price-series.test.js
      - name: Syntax checks
        run: |
          node --check lib/competition-price-series.js
          node --check index.js
          git diff --check
      - name: Commit source and remove one-shot tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/competition-price-series.js test/competition-price-series.test.js
          git rm scripts/patch-competition-price-no-fallback.py .github/workflows/patch-competition-price-no-fallback.yml
          git commit -m 'fix: require official Competition multipliers for Price v3'
          git push origin HEAD:chatgpt/competition-dual-price-boundaries
