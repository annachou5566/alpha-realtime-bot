name: Apply Competition Price contract resolution

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/competition-price-contract-resolution
    paths:
      - '.github/workflows/apply-competition-price-contract-resolution.yml'

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/competition-price-contract-resolution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and test
        run: |
          set -Eeuo pipefail
          python scripts/patch-competition-price-contract-resolution.py
          npm test
          git diff --check
      - name: Commit clean source
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js lib/competition-token-config.js competition-token-config.test.js
          git rm scripts/patch-competition-price-contract-resolution.py
          git rm .github/workflows/apply-competition-price-contract-resolution.yml
          git commit -m 'fix: resolve Competition Price tokens by official contract'
          git push origin HEAD:chatgpt/competition-price-contract-resolution
