name: Apply Competition calendar series final

on:
  push:
    branches:
      - chatgpt/competition-calendar-series
    paths:
      - 'scripts/apply_competition_calendar_series_final.py'
      - '.github/workflows/apply-competition-calendar-series-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/competition-calendar-series
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final source patch
        run: python scripts/apply_competition_calendar_series_final.py
      - name: Validate
        run: |
          node --check index.js
          node --check lib/competition-price-series.js
          node --test test/competition-price-series.test.js
          git diff --check
      - name: Commit source
        run: |
          if git diff --quiet; then
            echo 'No product changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js lib/competition-price-series.js test/competition-price-series.test.js
          git commit -m 'fix: migrate Competition price series to UTC boundaries'
          git push origin HEAD:chatgpt/competition-calendar-series
