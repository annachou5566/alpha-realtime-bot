name: Finalize competition price rollout

on:
  push:
    branches:
      - chatgpt/competition-calendar-series
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/competition-calendar-series
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply fail-closed R2 backup and dry-run fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.js')
          source = path.read_text(encoding='utf-8')

          old = """async function persistPriceSeriesToR2() {
              const nextHash = stableJsonHash(PRICE_SERIES_CACHE);
              if (nextHash === PRICE_SERIES_LAST_HASH) return false;
              const body = JSON.stringify(PRICE_SERIES_CACHE);
              await s3Client.send(new PutObjectCommand({
                  Bucket: process.env.R2_BUCKET_NAME,
                  Key: PRICE_SERIES_KEY,
                  Body: body,
                  ContentType: 'application/json',
                  CacheControl: 'public, max-age=300',
              }));
              PRICE_SERIES_LAST_HASH = nextHash;
              PRICE_SERIES_LAST_UPDATED_AT = Date.now();
              return true;
          }
          """
          new = """let PRICE_SERIES_BACKUP_STATE = { ready: false, key: null, sourceHash: null, status: 'pending' };

          function isMissingR2Object(error) {
              const status = Number(error && error.$metadata && error.$metadata.httpStatusCode);
              return status === 404 || ['NoSuchKey', 'NotFound'].includes(String(error && error.name || ''));
          }

          async function ensurePriceSeriesBackup() {
              if (PRICE_SERIES_BACKUP_STATE.ready) return PRICE_SERIES_BACKUP_STATE;

              let sourceObject;
              try {
                  sourceObject = await s3Client.send(new GetObjectCommand({
                      Bucket: process.env.R2_BUCKET_NAME,
                      Key: PRICE_SERIES_KEY,
                  }));
              } catch (error) {
                  if (!isMissingR2Object(error)) throw error;
                  PRICE_SERIES_BACKUP_STATE = {
                      ready: true,
                      key: null,
                      sourceHash: null,
                      status: 'source-missing',
                  };
                  console.log('[PRICE-BACKUP] source object missing; first write may proceed');
                  return PRICE_SERIES_BACKUP_STATE;
              }

              const raw = await sourceObject.Body.transformToString();
              let parsed;
              try {
                  parsed = JSON.parse(raw) || {};
              } catch (error) {
                  throw new Error(`Refusing Price write because the existing R2 object is invalid JSON: ${error.message}`);
              }

              const sourceHash = stableJsonHash(parsed);
              const backupKey = `backups/competition-price-series/${sourceHash}.json`;
              let status = 'existing';
              try {
                  await s3Client.send(new HeadObjectCommand({
                      Bucket: process.env.R2_BUCKET_NAME,
                      Key: backupKey,
                  }));
              } catch (error) {
                  if (!isMissingR2Object(error)) throw error;
                  await s3Client.send(new PutObjectCommand({
                      Bucket: process.env.R2_BUCKET_NAME,
                      Key: backupKey,
                      Body: raw,
                      ContentType: 'application/json',
                      CacheControl: 'no-cache, no-store, must-revalidate',
                      Metadata: {
                          source: PRICE_SERIES_KEY,
                          sourcehash: sourceHash,
                      },
                  }));
                  status = 'created';
              }

              PRICE_SERIES_BACKUP_STATE = { ready: true, key: backupKey, sourceHash, status };
              console.log(`[PRICE-BACKUP] ${status}: ${backupKey}`);
              return PRICE_SERIES_BACKUP_STATE;
          }

          async function persistPriceSeriesToR2() {
              const nextHash = stableJsonHash(PRICE_SERIES_CACHE);
              if (nextHash === PRICE_SERIES_LAST_HASH) return false;
              await ensurePriceSeriesBackup();
              const body = JSON.stringify(PRICE_SERIES_CACHE);
              await s3Client.send(new PutObjectCommand({
                  Bucket: process.env.R2_BUCKET_NAME,
                  Key: PRICE_SERIES_KEY,
                  Body: body,
                  ContentType: 'application/json',
                  CacheControl: 'public, max-age=300',
              }));
              PRICE_SERIES_LAST_HASH = nextHash;
              PRICE_SERIES_LAST_UPDATED_AT = Date.now();
              return true;
          }
          """
          if source.count(old) != 1:
              raise SystemExit(f'persistPriceSeriesToR2 pattern count: {source.count(old)}')
          source = source.replace(old, new)

          old = """            if (stableJsonHash(previous) !== stableJsonHash(existing)) migrated += 1;
                      PRICE_SERIES_CACHE[id] = existing;
                      const knownSlots = new Set(existing.points.map(point => Number(point.slot)));
          """
          new = """            if (stableJsonHash(previous) !== stableJsonHash(existing)) migrated += 1;
                      if (!dryRun) PRICE_SERIES_CACHE[id] = existing;
                      const knownSlots = new Set(existing.points.map(point => Number(point.slot)));
          """
          if source.count(old) != 1:
              raise SystemExit(f'dry-run cache pattern count: {source.count(old)}')
          source = source.replace(old, new)

          old = """        if (Number(dryRun.missing || 0) > 0) {
                      const result = await syncTournamentPriceSeries({ includeHistory: false, maxFetches: 40 });
          """
          new = """        if (Number(dryRun.missing || 0) > 0 || Number(dryRun.migrated || 0) > 0) {
                      const result = await syncTournamentPriceSeries({ includeHistory: false, maxFetches: 40 });
          """
          if source.count(old) != 1:
              raise SystemExit(f'startup gate pattern count: {source.count(old)}')
          source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')

          test_path = Path('test/index-contract.test.js')
          tests = test_path.read_text(encoding='utf-8')
          anchor = """    assert.doesNotMatch(source, /includeHistory: true, maxFetches: 100/);
          """
          addition = """    assert.doesNotMatch(source, /includeHistory: true, maxFetches: 100/);
              assert.match(source, /async function ensurePriceSeriesBackup\(\)/);
              assert.match(source, /backups\\/competition-price-series\\/\$\{sourceHash\}\\.json/);
              assert.match(source, /await ensurePriceSeriesBackup\(\);/);
              assert.match(source, /if \(!dryRun\) PRICE_SERIES_CACHE\[id\] = existing;/);
              assert.match(source, /Number\(dryRun\.missing \|\| 0\) > 0 \|\| Number\(dryRun\.migrated \|\| 0\) > 0/);
          """
          if tests.count(anchor) != 1:
              raise SystemExit(f'test anchor count: {tests.count(anchor)}')
          tests = tests.replace(anchor, addition)
          test_path.write_text(tests.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Install and test
        run: |
          npm install --ignore-scripts
          npm test
          git diff --check

      - name: Remove one-shot workflow and commit product source
        run: |
          rm .github/workflows/finalize-competition-price-rollout.yml
          rm -f .github/competition-price-rollout.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.js test/index-contract.test.js .github/workflows/finalize-competition-price-rollout.yml .github/competition-price-rollout.trigger
          git diff --cached --check
          git commit -m "fix: back up Price series before UTC migration"
          git push origin HEAD:chatgpt/competition-calendar-series
