name: Apply startup price backfill

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'chatgpt/startup-price-backfill'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical startup backfill change
        shell: bash
        run: |
          set -Eeuo pipefail
          PATCHER=.github/patches/apply-startup-backfill.js
          if [[ ! -f "$PATCHER" ]]; then
            echo "Startup backfill already applied"
            exit 0
          fi
          node "$PATCHER"
          node --check index.js
          node --test
          git diff --check
          rm -f "$PATCHER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Run one bounded historical price backfill at startup"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
